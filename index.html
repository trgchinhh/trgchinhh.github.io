<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trường Chinh</title>
  <meta name="description" content="Portfolio cá nhân của Trường Chinh">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style1.css">

</head>
<body>

<nav>
  <span class="nav-logo"><i class="fa-solid fa-laptop-code" style="color:var(--accent);"></i> NTC++</span>
  <div class="nav-links">
    <a href="#info">Thông tin</a>
    <a href="#projects">Dự án</a>
    <a href="#contact">Liên hệ</a>
    <button class="theme-toggle" id="themeToggle" title="Đổi giao diện">
      <i class="ph-bold ph-sun-horizon" id="themeIcon"></i>
    </button>
  </div>
</nav>

<!-- ══ MAIN VIEW ══ -->
<div class="main-view" id="mainView">

  <!-- HERO -->
  <section id="hero">
    <div class="container">
      <div class="avatar-wrap">
        <!-- Thay src="your-photo.png" bằng ảnh thực của bạn -->
        <img src="img/avatar2.png" alt="Trường Chinh"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="avatar-placeholder" style="display:none">NTC</div>
      </div>
      <h1 class="hero-name">Trường Chinh</h1>
      <p class="hero-title">Sinh viên</p>
      <p class="hero-bio">
        Lang thang trên mạng và xây dựng mọi thứ bằng ý tưởng chính mình 
      </p>
      <div class="hero-links">
        <a class="btn btn-primary" href="https://github.com/trgchinhh" target="_blank">
          <i class="fab fa-github"></i> GitHub
        </a>
        <a class="btn btn-outline" href="#projects">
          Xem dự án
        </a>
      </div>
    </div>
  </section>

  <!-- BLOG -->
  <section id="blog">
    <div class="container">
      <div class="section-header">
        <h2>Thông tin</h2>
        <!-- <a href="#" onclick="showAllBlogs(); return false;">Xem tất cả →</a> -->
      </div>
      <div class="blog-list" id="blogList">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- ảnh -->
  <section class="gallery">
    <div class="container">
      <div class="section-header">
        <h2>Kỷ niệm</h2>
      </div>
      <div class="gallery-track">
        <div class="gallery-item"><img src="img/1.png" alt=""></div>
        <div class="gallery-item"><img src="img/2.png" alt=""></div>
        <div class="gallery-item"><img src="img/3.png" alt=""></div>
        <div class="gallery-item"><img src="img/4.png" alt=""></div>
        <div class="gallery-item"><img src="img/5.png" alt=""></div>
        <div class="gallery-item"><img src="img/6.png" alt=""></div>
        <div class="gallery-item"><img src="img/7.png" alt=""></div>
        <div class="gallery-item"><img src="img/8.png" alt=""></div>
        <div class="gallery-item"><img src="img/9.png" alt=""></div>
        <div class="gallery-item"><img src="img/10.png" alt=""></div>
      </div>
      <button class="gallery-prev">‹</button>
      <button class="gallery-next">›</button>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects">
    <div class="container">
      <div class="section-header">
        <h2>Dự án</h2>
        <!-- <a href="https://github.com/trgchinhh" target="_blank">GitHub →</a> -->
      </div>

      <div class="project-tabs" id="projectTabs">
        <button class="tab-btn active" data-filter="all">Tất cả</button>
        <button class="tab-btn" data-filter="bot">Bot Telegram</button>
        <button class="tab-btn" data-filter="lib">Thư viện</button>
        <button class="tab-btn" data-filter="cpp">C++</button>
        <button class="tab-btn" data-filter="web">Web</button>
      </div>

      <div class="projects-grid" id="projectsGrid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- FOOTER / CONTACT -->
  <footer id="contact">
    <div class="container">
      <div class="footer-social">
        <a href="https://github.com/trgchinhh" target="_blank">
          <i class="fab fa-github"></i> trgchinhh
        </a>
        <a href="https://facebook.com/trgchinhh" target="_blank">
          <i class="fab fa-facebook"></i> Facebook
        </a>
        <a href="https://instagram.com/trgchinhh" target="_blank">
          <i class="fab fa-instagram"></i> Instagram
        </a>
      </div>
      <p class="footer-copy">
        © 2026 <span>Trường Chinh</span>. Bản quyền đã được bảo lưu.
      </p>
    </div>
  </footer>

</div><!-- /main-view -->

<!-- ══ BLOG DETAIL PAGE ══ -->
<div class="page-view" id="blogPage">
  <div class="container">
    <div style="display: flex; justify-content: center; padding: 32px 0 40px;">
      <div class="avatar-wrap">
        <img src="img/avatar2.png" alt="Trường Chinh"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="avatar-placeholder" style="display:none">NTC</div>
      </div>
    </div>
    <div class="blog-post-body" id="bpBody"></div>
  </div>
</div>

<!-- ══ PROJECT MODAL ══ -->
<div class="modal-overlay" id="projectModal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalDirect()"><i class="fa-solid fa-xmark"></i></button>
    <div class="modal-header-img" id="mEmoji"></div>
    <div class="modal-body">
      <h2 id="mTitle"></h2>
      <p class="modal-subtitle" id="mSub"></p>
      <p class="modal-desc" id="mDesc"></p>
      <div class="modal-features" id="mFeatures"></div>
      <div class="modal-links" id="mLinks"></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="style1.js"></script>

</body>
</html>
