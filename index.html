<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trường Chinh</title>
  <meta name="description" content="Portfolio Trường Chinh">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style1.css">
</head>
<body>

<nav>
  <span class="nav-logo">
    <span class="term-box" aria-hidden="true">
      <span class="term-prompt">&gt;</span><span class="logo-cursor"></span>
    </span>
    <span class="nav-name">Truong Chinh</span>
  </span>
  <div class="nav-links">
    <button class="theme-toggle" id="themeToggle" title="Đổi giao diện">
      <i class="ph-bold ph-sun" id="themeIcon"></i>
    </button>
  </div>
</nav>

<main class="main-view" id="mainView">

  <div class="container">
    <div class="info-avatar-top">
      <div class="avatar-wrap">
        <div class="avatar-3d" id="avatar3d"></div>
        <div class="avatar-placeholder" id="avatarFallback" style="display:none">NTC</div>
        <div class="avatar-intro">
          Xin chào mình tên <strong>Nguyễn Trường Chinh</strong><br> 
          Sinh viên ngành CNTT
          Trường Đại học Công nghệ Sài Gòn (STU)
        </div>
      </div>
    </div>
    <div class="info-post-body" id="bpBody"></div>
  </div>

  <!-- KỶ NIỆM -->
  <section class="gallery">
    <div class="container">
      <div class="section-header">
        <h2>Kỷ niệm</h2>
      </div>
      <div class="gallery-track">
        <div class="gallery-item"><img src="img/1.png" alt=""></div>
        <div class="gallery-item"><img src="img/2.png" alt=""></div>
        <div class="gallery-item"><img src="img/3.png" alt=""></div>
        <div class="gallery-item"><img src="img/4.png" alt=""></div>
        <div class="gallery-item"><img src="img/5.png" alt=""></div>
        <div class="gallery-item"><img src="img/6.png" alt=""></div>
        <!-- <div class="gallery-item"><img src="img/7.png" alt=""></div> -->
      </div>
      <button class="gallery-prev">‹</button>
      <button class="gallery-next">›</button>
    </div>
  </section>

  <!-- LIÊN HỆ -->
  <footer id="contact">
    <div class="container">      
      <div class="footer-social">
        <a href="https://github.com/trgchinhh" target="_blank">
          <i class="fab fa-github"></i> trgchinhh
        </a>
        <a href="https://facebook.com/trgchinhh" target="_blank">
          <i class="fab fa-facebook"></i> Facebook
        </a>
        <a href="https://instagram.com/trgchinhh" target="_blank">
          <i class="fab fa-instagram"></i> Instagram
        </a>
      </div>
      <p class="footer-copy">
        © 2026 <span>Trường Chinh</span>. Bản quyền đã được bảo lưu
      </p>
    </div>
  </footer>

</main><!-- /main-view -->

<script src="data.js"></script>
<script src="app.js"></script>
<script src="style1.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js"
    }
  }
</script>
<script type="module" src="avatar3d.js"
        onerror="document.getElementById('avatarFallback').style.display='flex';"></script>
<script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
<script>
  new Lenis({
    lerp: 0.24,
    wheelMultiplier: 1,
    smoothWheel: true,
    autoRaf: true
  });
</script>

</body>
</html>
